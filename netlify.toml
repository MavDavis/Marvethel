[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy all /api requests to the Express backend on Render
# Replace RENDER_URL with your actual Render service URL after deploying
[[redirects]]
  from   = "/api/*"
  to     = "https://marvethel-api.onrender.com/api/:splat"
  status = 200
  force  = true
