[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy all /api requests to the Express backend on Render
[[redirects]]
  from   = "/api/*"
  to     = "https://marvethel.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback — all non-file routes serve index.html for Vue Router
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
